llm_mapper:
  deepseek-v3:
    base_url: http://xxx.xx.xx.xx:xxxx/v1
    api_key: your-api-key-here
    # The "openai/" prefix is required for using LLM through openai API. 
    #See https://docs.litellm.ai/docs/providers/openai_compatible for more details.
    model: openai/model_name
    temperature: 0

  # openai
  gpt-5.4-mini:
    base_url: https://api.openai.com/v1
    model: openai/gpt-5.4-mini
    temperature: 0
  gpt-5.6-terra:
    base_url: https://api.openai.com/v1
    model: openai/gpt-5.6-terra
    reasoning_effort: medium
  gpt-5.6-terra-tools:
    base_url: https://api.openai.com/v1
    model: openai/gpt-5.6-terra
    reasoning_effort: none

  gemini-2.5-flash:
    # base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    # base_url: https://api.openrouter.ai/api/v1
    # api_key: ${GEMINI_API_KEY}
    api_key: ${GEMINI_API_KEY}
    model: gemini/gemini-2.5-flash
    # model: openai/google/gemini-2.5-flash
    temperature: 0

# local models
  local-qwen-0.6b:
