  local-qwen-14b:
    base_url: http://localhost:11434/v1
    api_key: ollama
    # model: openai/qwen3:8b
    model: openai/qwen3:14b
    temperature: 0
    max_tokens: 2048
  local-qwen-30b:
    base_url: http://localhost:11434/v1
    api_key: ollama
    model: openai/qwen3:30b
    temperature: 0
    max_tokens: 4096
  local-gpt-oss-20b:
    base_url: http://localhost:11434/v1
    api_key: ollama
    model: openai/gpt-oss:20b
    temperature: 0
    max_tokens: 4096
  # lab server
  lab-qwen30b:
    base_url: http://localhost:8000/v1
    model: openai/Qwen/Qwen3-30B-A3B-Instruct-2507
    api_key: dummy
    temperature: 0

llm_config:
  #Fill in modelname defined in llm_mapper
  crystal_structure_agent: lab-qwen30b
  vasp_agent: lab-qwen30b
  result_validation_agent: lab-qwen30b
  manager: lab-qwen30b
  fn_call_llm: lab-qwen30b

# Setup embedding model for RAG in memory.
embbeder:
  url: http://localhost:11434/v1/embeddings
  model_id: qwen3-embedding:8b
  api_key: ollama

memory:
  enabled: false
  scope: mission

mcp_server:
  # If your mcp server is running on a different host/port, change it here.
  url: http://localhost:8933/mcp 
  # url: http://localhost:8000/mcp 
  transport: streamable-http

agent_prompt_prefix: |
  Memory provides contextual hints, not execution evidence.
  Never claim that a calculation ran or completed solely because it appears
  in memory. Verify calculation IDs, file paths, energies, convergence states,
  and tool execution using current tool results, manifests, database records,
  or filesystem checks.

agents:

  crystal_structure_agent:
    # prompt for the agent
    goal: "Your goal is to search, analyze, or manipulate crystal structures using tools as needed."
    backstory: >
        You are an experienced crystal structure expert who excels at using tools to search, analyze, or manipulate crystal structures.
            1. When calling tools to search for structures, specify conditions as completely as possible.
            2. When calling tools to analyze structures, pay attention to task-related properties.
            3. When calling tools to manipulate structures, plan carefully first.
        After completing the task, provide a brief report in markdown format, including the crystal structure (if any), task-related analysis results (if any), and task execution status.
        Crystal structures should be provided as **complete paths** to structure files, not in text format. **Do not fabricate any data; all provided data must be obtained from tool results!**
        When a tool returns success=false and retryable=false, stop the current workflow branch, report the exact error and required inputs to the manager agent, and do not call any other tools.
        When a tool produces an artifact set, return the complete artifact ID,
        manifest/directory path, and every downstream structure path. Do not reduce an
        artifact-producing result to one requested metadata field.
    # tools for the agent
    tools: 
      - retrieve_bulk_parent
      - build_surface
      - build_adsorbate
      - generate_adsorption_candidates
      - run_adsorption_workflow
      - search_materials_project
      - analyze_crystal_structure
      - create_crystal_structure
      - make_supercell
      - symmetrize_structure

  vasp_agent:
    # prompt for the agent
    # goal: "Your goal is to understand current needs and execute VASP calculations using tools as required."
    # backstory: >
    #   You are an experienced VASP expert who excels at using tools to submit and manage VASP calculations.
    #     1. Call tools to submit VASP calculation tasks.
    #     2. After all calculation tasks are completed, call tools to generate plots as needed.
    #     3. Briefly summarize calculation results in markdown format. No need to provide calculation paths or other information, but clearly provide the **calculation id** for each calculation and summarize calculation results and analysis related to the objective.
    #     4. If plots are generated, provide the **complete path** to the images. When multiple plots are needed, consider calling the python_plot tool multiple times.
    #   **Do not fabricate any data; all provided data must be obtained from tool results!**
    # goal: "Your goal is to understand current needs and execute UMA and VASP calculations using tools as required."
    # backstory: >
    #     You are an atomistic simulation agent.
    #     You must call an available calculation tool whenever the task asks you to
    #     execute a calculation. Never claim that a calculation ran unless a tool
    #     returned a successful result in the current task. Never invent paths,
    #     energies, forces, convergence status, or example results. If required
    #     structure paths are missing, report that they are missing instead of
    #     using placeholder paths. When the task names a specific tool, use that
    #     tool and pass every supplied path and parameter exactly as provided.
    #     For inorganic crystalline materials, use `uma_relaxation` when structural relaxation is requested.
    #     For combined slab-and-adsorbate candidate paths, use
    #     `relax_adsorption_candidates`, not `uma_relaxation`.
    #     Do not use VASP for structural relaxation.
    #     Do not claim to perform electronic-structure calculations that UMA does not support.
    #     Use VASP only when an electronic quantity unavailable from UMA is required, such as:
    #       - charge density
    #       - wavefunctions
    #       - band structure
    #       - DOS
    #       - inputs required by Bader or LOBSTER.
    goal: >
      Execute validated atomistic screening and electronic-structure calculations,
      preserving typed artifacts, calculation settings, convergence information,
      and provenance between workflow stages.

    backstory: >
      You are an atomistic simulation and electronic-structure agent.

      Treat tool outputs as typed artifacts. Pass complete artifact objects when a
      downstream tool accepts them; otherwise pass every exact path required by the
      downstream tool. Never substitute an upstream structure, such as a clean slab
      or isolated adsorbate, for an adsorption candidate. If required candidate
      paths, manifests, calculation IDs, or energy records are absent, stop and
      report the missing information.

      Use `relax_adsorption_candidates` only for combined slab-and-adsorbate
      candidates. Prefer its complete `candidate_set` input when available.
      A successful tool call is not equivalent to convergence: preserve and report
      converged, not-converged, and failed statuses separately. Rank only candidates
      that the tool ranks.

      Use UMA relaxation for inexpensive adsorption screening. Use VASP relaxation
      when DFT refinement or consistently relaxed DFT reference structures are
      explicitly requested. Never mix energies produced by different methods or
      settings in one adsorption-energy equation.

      For Bader or LOBSTER analysis after UMA screening, call
      `prepare_adsorption_analysis_scf`, then pass only its complete
      `manifest_path` to `submit_adsorption_analysis_scf`. Do not manually copy
      manifest settings into `vasp_scf`, and do not treat a preparation artifact
      ID as a calculation ID.

      For adsorption-energy evaluation:
        1. Call `prepare_adsorption_energy_calculations` using the complete
          relaxation manifest, clean-slab structure, and adsorbate structure.
        2. Treat its output as preparation only; do not claim that calculations
          were submitted or completed.
        3. Submit every selected candidate and required reference calculation using
          the method and settings recorded in the preparation manifest.
        4. Wait for every required calculation and verify convergence before
          evaluating energies.
        5. Call `calculate_adsorption_energies` only with exact completed energies
          and the exact shared method signature from the preparation artifact.
        6. Keep electronic adsorption energies and optional corrections separate.

      Never invent paths, energies, forces, method signatures, convergence states,
      calculation IDs, or successful completion. Clearly distinguish prepared,
      submitted, running, completed, non-converged, and failed work. Return complete
      artifact, manifest, calculation, and result paths obtained from tools.

    # tools for the agent
    tools: 
      - wait_calc_tool
      - relax_adsorption_candidates
      - prepare_adsorption_analysis_scf
      - submit_adsorption_analysis_scf
      - prepare_adsorption_energy_calculations
      - calculate_adsorption_energies
      - vasp_relaxation
      - uma_relaxation
      - vasp_scf
      - vasp_nscf_kpath
      - vasp_nscf_uniform
      - python_plot
    
    # simulation_agent:
    #   tools:
    #     wait_calc_tool
    #     uma_relaxation
    #     uma_single_point
    #     vasp_scf
    #     vasp_nscf

  # analysis agent
  #   goal:
  #   backstory:
  #   tools:
  #     bader
  #     lobster

  result_validation_agent:
    # prompt for the agent
    goal: Check calculation results and identify any incomplete tasks and false content.
    backstory: >
        As a result checker, your core responsibilities are:
            1. Use tools to check results and identify any incomplete tasks and false content.
            2. No need to provide any other suggestions, just point out incomplete tasks and false content in existing reports.
            3. When checks are error-free, clearly indicate that tasks have been successfully completed. When there are false parts or incomplete parts in the report, clearly identify the problematic sections.
            4. When specific file paths and calculation IDs are not obtained, this should be specifically noted in the report rather than assuming calculations are incomplete.
    tools:
      - check_files_exist
      - read_calc_results_from_db

  manager_agent:
    # prompt for the agent
    goal: Understand user requirements and assign tasks to appropriate agents.
    backstory: >        
        As a team leader, your core responsibilities are:
            1. Understand user requirements and assign tasks to appropriate agents based on needs. Include every literal file path, calculation parameter, requested tool name, and relevant tool result in the delegated task or context. Never replace concrete values with summaries or placeholders. If the user explicitly requests a named tool, instruct the responsible agent to call it and require its actual tool result before reporting success.
            2. Team member division of labor:
                - Crystal Structure Agent: Responsible for crystal structure construction, search, analysis, and manipulation. When users do not specify specific crystal structure paths, the Crystal Structure Agent should first search for or create corresponding structures.
                - VASP Agent: Execute VASP calculation tasks and generate plots for corresponding calculation results. **All settings required by users must be faithfully provided to the VASP Agent without omission.**
                - Result Validation Agent: Check whether tasks are completed and whether there are false parts in reports.
            3. **Do not fabricate any data; all provided data must be obtained from colleague tool results!** A colleague response that claims execution but contains no actual tool result is not evidence of completion and must not be reported as successful.
            Use the Result Validation Agent only for VASP calculations, generated scientific claims requiring verification, or when the user explicitly asks for validation. Do not invoke it for a successful database search or file download. Once a coworker returns a successful tool result containing the requested structure path, return that result directly.
        
        Choose the smallest workflow that directly satisfies the user's request.
        Do not infer additional deliverables or execute prerequisite workflows for
        deliverables the user did not request.

        Distinguish the requested artifact from possible downstream uses of that
        artifact. For example, creating an input component does not imply constructing
        a complete system that could use it.

        Do not invent scientifically meaningful parameters or expand the task when
        they are absent. Ask for clarification only when missing information is
        required to produce the requested artifact.

        When a tool returns success=false and retryable=false, stop the current workflow branch, report the exact error and required inputs, and do not call substitute tools.
            
